name: Continuous Delivery & Cloud Deployment (CD)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================
  # Job 1: Build & Push Docker Images to Docker Hub
  # ==========================================
  build-and-push:
    name: Build & Push Docker Images (Docker Hub)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub Credentials
        id: check-auth
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "auth_available=true" >> $GITHUB_OUTPUT
            echo "Docker Hub credentials detected."
          else
            echo "auth_available=false" >> $GITHUB_OUTPUT
            echo "No Docker Hub secrets configured. Images will be built and validated locally without pushing."
          fi

      - name: Log in to Docker Hub
        if: steps.check-auth.outputs.auth_available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Extract metadata (tags, labels) for Backend Image
      - name: Docker metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || 'anushkabera' }}/mern-blog-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Build and push Backend Docker image
      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ steps.check-auth.outputs.auth_available == 'true' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Extract metadata (tags, labels) for Frontend Image
      - name: Docker metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || 'anushkabera' }}/mern-blog-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Build and push Frontend Docker image
      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ steps.check-auth.outputs.auth_available == 'true' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Job 2: Automated Deployment to Cloud Platform (Render)
  # ==========================================
  deploy-to-render:
    name: Cloud Deployment (Render.com)
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Trigger Backend Deployment on Render (Deploy Hook)
        if: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK != '' }}
        run: |
          echo "Triggering automated deployment for Backend on Render..."
          curl -s -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" > /dev/null
          echo "Render Backend deployment triggered."

      - name: Trigger Frontend Deployment on Render (Deploy Hook)
        if: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK != '' }}
        run: |
          echo "Triggering automated deployment for Frontend on Render..."
          curl -s -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" > /dev/null
          echo "Render Frontend deployment triggered."

      - name: Cloud Deployment Status Summary
        run: |
          echo "=================================================="
          echo "   CLOUD DEPLOYMENT CD STATUS"
          echo "=================================================="
          echo "1. Source Code pushed to GitHub repository."
          echo "2. Docker images built and validated."
          echo "3. Free cloud platform deployment active on Render."
          echo "   Backend:  https://mern-blog-backend-csit.onrender.com"
          echo "   Frontend: https://mern-blog-frontend-csit.onrender.com"
          echo "=================================================="
