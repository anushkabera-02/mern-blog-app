name: Continuous Delivery & Cloud Deployment (CD)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================
  # Job 1: Build & Push Docker Images to Docker Hub
  # ==========================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    outputs:
      backend-image: ${{ steps.meta-backend.outputs.tags }}
      frontend-image: ${{ steps.meta-frontend.outputs.tags }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Extract metadata (tags, labels) for Backend Image
      - name: Docker metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/mern-blog-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Build and push Backend Docker image
      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Extract metadata (tags, labels) for Frontend Image
      - name: Docker metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/mern-blog-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Build and push Frontend Docker image
      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Job 2: Deploy Services to Google Cloud Run (Optional if GCP credentials configured)
  # ==========================================
  deploy-to-cloud-run:
    name: Deploy to Google Cloud Run
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ secrets.GCP_SA_KEY != '' }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Authenticate with Google Cloud using Service Account Key
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Deploy Backend to Google Cloud Run
      - name: Deploy Backend to Google Cloud Run
        id: deploy-backend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: mern-blog-backend
          image: ${{ secrets.DOCKERHUB_USERNAME }}/mern-blog-backend:latest
          region: ${{ secrets.GCP_REGION || 'us-central1' }}
          flags: |
            --port=5000
            --allow-unauthenticated
            --set-env-vars=NODE_ENV=production,MONGO_URI=${{ secrets.MONGO_URI }},CLIENT_ORIGIN=*

      # Retrieve the Deployed Backend Service URL
      - name: Show Backend Service URL
        run: |
          echo "Backend Service successfully deployed at:"
          echo "${{ steps.deploy-backend.outputs.url }}"

      # Deploy Frontend to Google Cloud Run
      - name: Deploy Frontend to Google Cloud Run
        id: deploy-frontend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: mern-blog-frontend
          image: ${{ secrets.DOCKERHUB_USERNAME }}/mern-blog-frontend:latest
          region: ${{ secrets.GCP_REGION || 'us-central1' }}
          flags: |
            --port=80
            --allow-unauthenticated

      # Display Final Deployment Information
      - name: Summary of Deployment
        run: |
          echo "=================================================="
          echo "  CLOUD DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "=================================================="
          echo "Frontend Web URL: ${{ steps.deploy-frontend.outputs.url }}"
          echo "Backend API URL:  ${{ steps.deploy-backend.outputs.url }}"
          echo "=================================================="
